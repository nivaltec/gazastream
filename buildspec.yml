version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 16
    commands:
      - echo "Installing dependencies..."
      - npm install
      - npm install -g @angular/cli@15.1.4
  build:
    commands:
      - echo "Building Angular project..."
      - ng build --configuration production
  post_build:
    commands:
      - echo "Updating files in the S3 bucket..."
      - aws s3 cp dist/gazastream s3://gazastream-app --recursive
      - echo Build completed on `date`
