<article class="gaza-video-card" [class.is-active]="isActive" [class.is-playing]="isPlaying"
  [attr.aria-label]="video.title || 'Video'" role="article" (click)="playVideo()">

  <!-- =========================================================
       MEDIA / ARTWORK
       ========================================================= -->

  <div class="gaza-video-card__media">

    <!-- Artwork -->
    <img *ngIf="hasArtwork" class="gaza-video-card__image" [src]="artworkUrl" [alt]="video.title || 'Video artwork'"
      loading="lazy" decoding="async" draggable="false" (error)="onArtworkError()" />

    <!-- Artwork fallback -->
    <div *ngIf="!hasArtwork" class="gaza-video-card__fallback" aria-hidden="true">

      <div class="gaza-video-card__fallback-glow"></div>

      <div class="gaza-video-card__fallback-icon">
        <i class="fa-solid fa-video"></i>
      </div>

      <span>GAZA STREAM</span>

    </div>

    <!-- Dark overlay -->
    <div class="gaza-video-card__overlay" aria-hidden="true"></div>

    <!-- Top provider badge -->
    <span class="gaza-video-card__type">

      <i [class]="providerIcon"></i>

      {{ providerLabel }}

    </span>

    <!-- Play button -->
    <button type="button" class="gaza-video-card__play" [class.is-playing]="isPlaying" [attr.aria-label]="
        isPlaying
          ? 'Pause ' + video.title
          : 'Play ' + video.title
      " (click)="$event.stopPropagation(); playVideo()">

      <i class="fa-solid" [ngClass]="playIcon"></i>

    </button>

    <!-- Playing animation -->
    <div *ngIf="isPlaying" class="gaza-video-card__playing" aria-hidden="true">

      <span></span>
      <span></span>
      <span></span>

    </div>

    <!-- Duration -->
    <span *ngIf="durationLabel" class="gaza-video-card__duration">
      {{ durationLabel }}
    </span>

  </div>


  <!-- =========================================================
       CONTENT
       ========================================================= -->

  <div class="gaza-video-card__content">

    <h3 class="gaza-video-card__title" [title]="video.title">
      {{ video.title }}
    </h3>

    <p *ngIf="video.artist" class="gaza-video-card__artist" [title]="video.artist">
      {{ video.artist }}
    </p>

  </div>

</article>
